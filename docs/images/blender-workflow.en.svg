<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Block the space. Check the shot. Refine.</title>
<desc id="desc">English functional workflow diagram. This is an operating method, not a rendered production result.</desc>
<rect width="1200" height="480" rx="24" fill="#0d1826" />
<path d="M40 410 L1160 410" stroke="#2b4157" />
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="48" y="60" font-size="15" fill="#83c5be">Azer · Zhulong Director Pro</text>
<text x="48" y="110" font-size="32" font-weight="700" fill="#f5f5f0">Block the space. Check the shot. Refine.</text>
<text x="48" y="145" font-size="17" fill="#a8b9c7">Reusable lessons from greybox practice; no one-click modeling engine is included.</text>
<rect x="48" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a" />
<text x="70" y="233" font-size="15" fill="#efb86d">01</text>
<text x="70" y="273" font-size="23" font-weight="700" fill="#f5f5f0">Define the Scope</text>
<text x="70" y="308" font-size="16" fill="#b4c5d3">Scale · Axes · Parts</text>
<text x="70" y="334" font-size="16" fill="#b4c5d3">New task or owned collection</text>
<path d="M311 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2" />
<rect x="330" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a" />
<text x="352" y="233" font-size="15" fill="#efb86d">02</text>
<text x="352" y="273" font-size="23" font-weight="700" fill="#f5f5f0">Block &amp; Model</text>
<text x="352" y="308" font-size="16" fill="#b4c5d3">Primitives · Space · Support</text>
<text x="352" y="334" font-size="16" fill="#b4c5d3">Separate waiting and motion</text>
<path d="M593 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2" />
<rect x="612" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a" />
<text x="634" y="233" font-size="15" fill="#efb86d">03</text>
<text x="634" y="273" font-size="23" font-weight="700" fill="#f5f5f0">Camera &amp; Phases</text>
<text x="634" y="308" font-size="16" fill="#b4c5d3">View · Facing · Occlusion</text>
<text x="634" y="334" font-size="16" fill="#b4c5d3">Inspect start / turn / end</text>
<path d="M875 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2" />
<rect x="894" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a" />
<text x="916" y="233" font-size="15" fill="#efb86d">04</text>
<text x="916" y="273" font-size="23" font-weight="700" fill="#f5f5f0">Verify &amp; Deliver</text>
<text x="916" y="308" font-size="16" fill="#b4c5d3">Read back · Inspect visually</text>
<text x="916" y="334" font-size="16" fill="#b4c5d3">Coordinator applies bindings</text>
<text x="48" y="445" font-size="16" fill="#a8b9c7">On demand · Preserve the scene · No automatic MCP installation or media calls</text>
</g></svg>
