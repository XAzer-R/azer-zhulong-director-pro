<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">先搭空间，再看镜头，逐步细化</title>
<desc id="desc">将旧白模经验转为通用操作方法；当前交付不包含一键建模引擎。；明确对象与范围；白模与基础建模；机位与关键相位；验证后交付</desc>
<rect width="1200" height="480" rx="24" fill="#0d1826"/>
<path d="M40 410 L1160 410" stroke="#2b4157"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="48" y="60" font-size="15" fill="#83c5be">阿泽 · 烛龙造境</text>
<text x="48" y="110" font-size="32" font-weight="700" fill="#f5f5f0">先搭空间，再看镜头，逐步细化</text>
<text x="48" y="145" font-size="17" fill="#a8b9c7">将旧白模经验转为通用操作方法；当前交付不包含一键建模引擎。</text>
<rect x="48" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="70" y="233" font-size="15" fill="#efb86d">01</text>
<text x="70" y="273" font-size="23" font-weight="700" fill="#f5f5f0">明确对象与范围</text>
<text x="70" y="308" font-size="16" fill="#b4c5d3">尺寸 · 轴向 · 部件关系</text>
<text x="70" y="334" font-size="16" fill="#b4c5d3">新建任务或限定 Collection</text>
<path d="M311 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2"/>
<rect x="330" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="352" y="233" font-size="15" fill="#efb86d">02</text>
<text x="352" y="273" font-size="23" font-weight="700" fill="#f5f5f0">白模与基础建模</text>
<text x="352" y="308" font-size="16" fill="#b4c5d3">几何块体 · 占位 · 支撑</text>
<text x="352" y="334" font-size="16" fill="#b4c5d3">驻留与移动分别表达</text>
<path d="M593 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2"/>
<rect x="612" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="634" y="233" font-size="15" fill="#efb86d">03</text>
<text x="634" y="273" font-size="23" font-weight="700" fill="#f5f5f0">机位与关键相位</text>
<text x="634" y="308" font-size="16" fill="#b4c5d3">取景 · 朝向 · 遮挡 · 轨迹</text>
<text x="634" y="334" font-size="16" fill="#b4c5d3">起点 / 转折 / 末尾回看</text>
<path d="M875 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2"/>
<rect x="894" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="916" y="233" font-size="15" fill="#efb86d">04</text>
<text x="916" y="273" font-size="23" font-weight="700" fill="#f5f5f0">验证后交付</text>
<text x="916" y="308" font-size="16" fill="#b4c5d3">对象与文件回读 · 目检</text>
<text x="916" y="334" font-size="16" fill="#b4c5d3">交主控回填，保留原卡</text>
<text x="48" y="445" font-size="16" fill="#a8b9c7">按需执行 · 不清空用户场景 · 不自动安装 MCP · 不自动调用媒体供应商</text>
</g></svg>
