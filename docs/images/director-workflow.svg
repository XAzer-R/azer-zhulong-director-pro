<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">从剧本到可执行的画面设计</title>
<desc id="desc">三阶段专业主线，加一条按需启用的 Blender 建模与预演支线。；导演设计；服化道身份；分镜师精修；主控核验交接</desc>
<rect width="1200" height="480" rx="24" fill="#0d1826"/>
<path d="M40 410 L1160 410" stroke="#2b4157"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="48" y="60" font-size="15" fill="#83c5be">阿泽 · 烛龙造境</text>
<text x="48" y="110" font-size="32" font-weight="700" fill="#f5f5f0">从剧本到可执行的画面设计</text>
<text x="48" y="145" font-size="17" fill="#a8b9c7">三阶段专业主线，加一条按需启用的 Blender 建模与预演支线。</text>
<rect x="48" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="70" y="233" font-size="15" fill="#efb86d">01</text>
<text x="70" y="273" font-size="23" font-weight="700" fill="#f5f5f0">导演设计</text>
<text x="70" y="308" font-size="16" fill="#b4c5d3">剧本拆解 · 镜头意图</text>
<text x="70" y="334" font-size="16" fill="#b4c5d3">对白与动作链 → production</text>
<path d="M311 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2"/>
<rect x="330" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="352" y="233" font-size="15" fill="#efb86d">02</text>
<text x="352" y="273" font-size="23" font-weight="700" fill="#f5f5f0">服化道身份</text>
<text x="352" y="308" font-size="16" fill="#b4c5d3">人物与场景的结构基准</text>
<text x="352" y="334" font-size="16" fill="#b4c5d3">造型 · 材质身份 · 参考图</text>
<path d="M593 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2"/>
<rect x="612" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="634" y="233" font-size="15" fill="#efb86d">03</text>
<text x="634" y="273" font-size="23" font-weight="700" fill="#f5f5f0">分镜师精修</text>
<text x="634" y="308" font-size="16" fill="#b4c5d3">构图 · 质感 · 光影 · 氛围</text>
<text x="634" y="334" font-size="16" fill="#b4c5d3">关键帧渲染卡与回填建议</text>
<path d="M875 282 h14 m-5 -5 l5 5 -5 5" fill="none" stroke="#83c5be" stroke-width="2"/>
<rect x="894" y="196" width="258" height="172" rx="16" fill="#182b40" stroke="#35506a"/>
<text x="916" y="233" font-size="15" fill="#efb86d">04</text>
<text x="916" y="273" font-size="23" font-weight="700" fill="#f5f5f0">主控核验交接</text>
<text x="916" y="308" font-size="16" fill="#b4c5d3">版本复核 · 精确素材绑定</text>
